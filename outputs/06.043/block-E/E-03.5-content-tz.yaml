# =============================================================================
# ТЗ (этап 1) на разработку текстовых и графических материалов
# для контекстно-медийной стратегии продвижения
# Профстандарт: 06.043 «Специалист по интернет-маркетингу»
# ТФ: Е/03.5 «Составление заданий на разработку текстовых и графических
#     материалов для контекстно-медийной стратегии продвижения»
# Исполнитель ТЗ (постановка/приёмка): профиль ppc (Ян)
# Исполнитель контента (делегация full): профстандарт 06.013 (копирайтер)
# Продвигаемый продукт: твинблоки, Екатеринбург
# Этап: delegation_tz — постановка задания копирайтеру (ADR-012, delegation full)
# =============================================================================
tz:
  request_id: APR-01
  tf_code: "Е/03.5"
  source_tds:
    - "Составление технических заданий на внесение изменений в структуру и содержание веб-сайта"
    - "Составление технических заданий по написанию и редактированию текстов для рекламируемых страниц веб-сайта"
    - "Составление технических заданий дизайнеру по подготовке медийного контента для объявлений"
  task_type: delegation_tz
  etapa: 1
  delegation:
    standard: "06.013"
    type: full
    note: "Сами тексты и графические материалы пишет копирайтер (06.013); 06.043 сохраняет постановку (данное ТЗ) и приёмку через HITL (ADR-012, ADR-006)."
  assignee: copywriter
  product: "Твинблоки (twinblocks), продажа — Екатеринбург"
  context_ref: "outputs/06.043/pilot/A-01.4-keywords.yaml (семантика продвижения: продажа твинблоков в Екатеринбурге, 31 ключевое слово, минус-слова); inputs/pilot-queries-06.043.yaml (исходные запросы)"

# ---------------------------------------------------------------------------
# Контекст продвижения (что задаёт рамку для всех материалов)
# ---------------------------------------------------------------------------
promotion_context:
  campaign_type: "Контекстно-медийная кампания (КМ) — Яндекс.Директ"
  goal: "Продажа твинблоков частным застройщикам и бригадам в Екатеринбурге и области"
  audience: "Частные застройщики, 30–50 лет, Екатеринбург + область"
  tone: "Экспертный, простой — как прораб объясняет клиенту; без канцелярита"
  product_usp:
    - "Цена от 98 руб/шт за куб — уточнить актуальную цену в прайсе перед запуском"
    - "Заводская доставка по Екатеринбургу"
    - "Сертификаты качества"
    - "Бесплатные образцы"
  semantic_core:
    ref: "outputs/06.043/pilot/A-01.4-keywords.yaml (разделы queries, accumulated_keyword_list)"
    target_queries_examples:
      - "купить твинблок екатеринбург"
      - "твинблок цена за куб"
      - "твинблок 400 мм размеры"
      - "твинблок купить дешево"
      - "твинблок доставка екатеринбург"
    minus_words_ref: "минус-слова из A-01.4 (поревит, инсиблок, авито, петрович, пеноблок, газосиликат и др.) — не использовать в текстах как целевые"

# ---------------------------------------------------------------------------
# Перечень материалов + требования к каждому
# ---------------------------------------------------------------------------
materials:
  # --- 1. Тексты объявлений Яндекс.Директа (КМ, поиск) ---
  - material_id: M-01
    type: "ad_texts"
    name: "Тексты объявлений Яндекс.Директ"
    executor: "копирайтер (06.013)"
    quantity: 3
    requirements:
      - "3 варианта с РАЗНЫМИ акцентами для A/B-теста: вариант 1 — цена/куб, вариант 2 — доставка/сервис, вариант 3 — качество/сертификаты. Варианты должны различаться лексически, не только порядком преимуществ."
      - "Ключевое слово из семантики — в заголовке 1 (первое слово совпадает с поисковым запросом)"
      - "УТП — в заголовке или первом предложении текста"
      - "Цифры и факты вместо общих слов (цена от ..., срок доставки, марка/размер блока)"
      - "Понятный призыв к действию (Купить / Заказать / Узнать цену)"
      - "Лимиты площадки: заголовок 1 до 56 знаков, заголовок 2 до 30 знаков, текст до 81 знака"
      - "Уточнения: минимум 4–5, оптимально 6–8, до 25 знаков каждое; распределять по категориям (цена / свойства / сервис), не дублировать смысл"
      - "Быстрые ссылки: до 4 шт, до 25 знаков каждая (навигация по разделам сайта)"
      - "Мобильная проверка: ключевая мысль не в последних 15 знаках заголовка"
    stop_words:
      - "Широкий ассортимент"
      - "Большой выбор"
      - "Гибкие условия"
      - "Индивидуальный подход"
      - "Оптимальное решение"
      - "Высокое качество"
      - "Доступные цены"
      - "Профессионалы своего дела"
    forbidden:
      - "Конкурентные бренды (поревит, инсиблок и др.)"
      - "Маркетплейсы/агрегаторы (авито, петрович)"
      - "Альтернативные материалы как целевые (пеноблок, газосиликат) без согласования"
      - "Слова-паразиты инфостиля (инновационный, высокотехнологичный)"

  # --- 2. Баннеры (медийные графические материалы) ---
  - material_id: M-02
    type: "banners"
    name: "Медийные баннеры для КМ (РСЯ/медийная сеть)"
    executor: "дизайнер (через копирайтер — ТЗ дизайнеру пп. 3.2 ТФ Е/03.5)"
    quantity: 3
    requirements:
      - "3 форм-фактора на выбор сетки: 728×90, 300×250, 240×400 (или согласованные с площадкой заказчика)"
      - "Короткий оффер (до 5–6 слов) на баннере: цена от / доставка / сертификаты"
      - "Фото/иллюстрация блока + УТП + призыв к действию"
      - "Крупный читаемый шрифт, контрастный к фону"
      - "Размер файла и формат — по требованиям площадки (обычно JPG/PNG; анимированные GIF/HTML5 — по запросу)"
      - "Текстовый слой баннера предоставить отдельной строкой (для проверки модерации и A/B)"
    stop_words: "те же, что для M-01 (короткость важнее полноты — не более одного УТП на баннер)"
    forbidden: "Ложные заявления о цене/свойствах без подтверждения прайсом; скрытые кнопки/наложения"

  # --- 3. Посадочные тексты (рекламируемые страницы веб-сайта) ---
  - material_id: M-03
    type: "landing_texts"
    name: "Тексты посадочных страниц (рекламируемые страницы веб-сайта)"
    executor: "копирайтер (06.013)"
    quantity: 1
    requirements:
      - "Текст целевой посадочной страницы под КМ-трафик (продажа твинблоков)"
      - "Структура: заголовок (H1) с ключевым словом → УТП → преимущества (цифры/факты) → калькулятор/цена за куб → отзывы → CTA + контакты"
      - "Закрывать 'partial'-запросы из семантики (калькулятор, отличие от газоблока, альбом технических решений) контентом страницы"
      - "Объём: до 1500–2500 знаков, без воды; под SEO-минимум по ключам"
      - "Тон — экспертный и простой, инфостиль (Главред, уровень чистоты не ниже зелёного)"
    stop_words: "те же, что для M-01"
    forbidden: "Фабричные SEO-тексты без фактов; дублирование рекламных офферов без подтверждения"

  # --- 4. ТЗ на изменение структуры/содержания сайта (при необходимости) ---
  - material_id: M-04
    type: "site_structure_tz"
    name: "ТЗ на внесение изменений в структуру и содержание веб-сайта"
    executor: "копирайтер (06.013) + dev/разметка (06.043)"
    quantity: 1
    requirements:
      - "Рекомендации по элементам посадочной страницы, отсутствующим на текущем сайте (калькулятор твинблока, страница 'как выбрать блок', сертификаты)"
      - "Список правок структуры/контента, которые повысят конверсию КМ-трафика"
      - "Каждая правка: где, что, зачем (ожидаемый эффект), приоритет"
    forbidden: "Размытые формулировки без адресации к странице и метрике"

# ---------------------------------------------------------------------------
# Критерии приёмки (для каждого материала)
# ---------------------------------------------------------------------------
acceptance_criteria:
  common:
    - "Все обязательные поля ТЗ соблюдены (продукт, ЦА, тип, количество, УТП, тон, объём)"
    - "Указаны акценты вариантов и рекомендуемый вариант"
    - "Текст чист по humanizer-ru / инфостилю (проверено Главред, без канцелярита и клише)"
    - "Соблюдены acceptance-standards-copywriter и delivery-standards-copywriter"
    - "Собран комментарий-саммари: решения, ключевые правки, рекомендуемый вариант"
  M-01:
    - "3 варианта, лексически разные, с разными акцентами"
    - "Каждая строка уложилась в лимиты: заголовок 1 ≤ 56 зн., заголовок 2 ≤ 30 зн., текст ≤ 81 зн., уточнения ≤ 25 зн."
    - "Уточнений не менее 4–5, распределены по категориям (цена/свойства/сервис)"
    - "Ключевое слово в заголовке 1, УТП в заголовке или 1-м предложении"
    - "Нет стоп-слов и PPC-клише"
  M-02:
    - "3 баннера в согласованных форм-факторах"
    - "Оффер читается за 1–2 секунды, один УТП на баннер"
    - "Текстовый слой предоставлен отдельной строкой"
    - "Файлы проходят требования площадки по формату/размеру"
  M-03:
    - "Структура H1→УТП→преимущества→цена→отзывы→CTA соблюдена"
    - "Closed 'partial'-запросы (калькулятор, отличие от газоблока)"
    - "Чистота текста по Главред не ниже зелёного уровня"
  M-04:
    - "Каждая правка адресована (страница/блок), с ожидаемым эффектом и приоритетом"

# ---------------------------------------------------------------------------
# Порядок сдачи и приёмки (HITL)
# ---------------------------------------------------------------------------
handoff:
  skills:
    - copywriting-core
    - ppc-ad-texts
    - humanizer-ru
    - text-proofreading
  delivered_to: "Ян (ppc) — профиль, выполняющий постановку и приёмку ТФ Е/03.5"
  review: "Приёмка через approval-request (ADR-006): результат копирайтера проходит HITL-проверку Яна перед включением в кампанию"

# ---------------------------------------------------------------------------
# Провенанс и защита от выдумывания
# ---------------------------------------------------------------------------
provenance:
  tf_code: "Е/03.5"
  profile: ppc
  task_type: delegation_tz
  request_id: APR-01
  anti_hallucination: >-
    ТЗ построено строго на входных данных: семантика и минус-слова берутся из
    outputs/06.043/pilot/A-01.4-keywords.yaml (1-в-1 без добавления новых запросов);
    УТП взяты из контекста продвижения твинблоков (рубрика promotion_context);
    тип материалов соответствует 3 ТД ТФ Е/03.5 (тексты объявлений, посадочные
    тексты, медийные баннеры, структура сайта). Внешние сущности (продукты,
    конкурентные бренды, гео) не выдуманы — все они уже присутствуют во входных
    артефактах. request_id APR-01 — первый в 06.043 (формат из blueprint ADR-006).

summary:
  request_id: APR-01
  tf_code: "Е/03.5"
  ruling: "ТЗ на разработку текстовых и графических материалов для КМ-стратегии сформировано и готово к передаче копирайтеру (06.013)"
  materials_count: 4
  materials:
    - "M-01: тексты объявлений Яндекс.Директ (3 варианта)"
    - "M-02: медийные баннеры (3 форм-фактора)"
    - "M-03: посадочные тексты (1 страница)"
    - "M-04: ТЗ на изменение структуры/содержания сайта (1)"
  acceptance: "Критерии приёмки заданы по каждому материалу; приёмка — HITL через approval-request"
