# =============================================================================
# G/04.5 — Привлечение пользователей в интернет-сообщество
# Профстандарт: 06.043 «Специалист по интернет-маркетингу» (ОТФ G, ур. 5)
# Исполнитель: профиль smm, навык audience-acquisition
# Сообщество: ВКонтакте, группа застройщиков Екатеринбурга
# Тематика: строительство домов из твинблоков
# ЦА: частные застройщики, 30–50 лет, Екатеринбург
# Общение с ЦА цифровыми методами; конкурсы/опросы; увеличение числа участников
# =============================================================================
tf_code: "G/04.5"
status: generated
community: >-
  ВКонтакте группа застройщиков Екатеринбурга. Тематика: строительство домов
  из твинблоков. ЦА: частные застройщики 30–50 лет.

# ---------------------------------------------------------------------------
# Механики привлечения аудитории. Без выдуманных призов/брендов/партнёров:
# вознаграждение конкурсов помечено «уточнить» (не задано во входе).
# Метрики — из входа или честное «нет данных».
# ---------------------------------------------------------------------------
mechanics:
  - type: "контент-серия"
    goal: >-
      Привлечь подписчиков релевантной ЦА (частные застройщики 30–50) за счёт
      полезного пошагового контента о строительстве дома из твинблоков: от выбора
      фундамента и кладки до отделки и сметы.
    steps:
      - "Разработать контент-серию из 8–10 постов: чек-листы, расчёт сметы, сравнение материала, этапы стройки, типовые ошибки."
      - "Оформить серию как закреплённый пост-навигатор со ссылками на части."
      - "Запустить регулярность публикаций (план-сетка) и призыв к вступлению/подписке."
      - "Отслеживать вовлечённость по каждому посту и дорабатывать темы по отклику."
    metrics:
      - "Число подписчиков группы (прирост за период)"
      - "Охват контента"
      - "Показы/дочитывания"
      - "Число сохранений и репостов серии"
      - "Нет данных по целевым значениям — во входе цифр нет"
    risk: "Контент без уникальности не зацепит ЦА; нужен реальный экспертный материал, иначе низкая вовлечённость и отписки."

  - type: "опрос"
    goal: >-
      Вовлечь существующих участников и собрать данные о потребностях ЦА,
      чтобы привлечь новых подписчиков через «виральность» обсуждений и
      релевантный последующий контент.
    steps:
      - "Опубликовать опрос ВКонтакте по актуальной теме застройщика (например: какой этап стройки самый сложный / какой тип дома выбираете)."
      - "Добавить открытый вариант ответа и комментарий-обсуждение."
      - "Прогреть итогами: выпустить пост с результатами опроса и выводами."
      - "Повторять серию опросов по мере поступления тем от аудитории."
    metrics:
      - "Число участников опроса"
      - "Число комментариев"
      - "Охват/вовлечённость поста с опросом"
      - "Прирост подписчиков в период опроса"
      - "Нет данных по целевым значениям"
    risk: "Опрос без последующей обратной связи («опрос ради опроса») снижает доверие; нужно публиковать результаты и реагировать."

  - type: "конкурс"
    goal: >-
      Стимулировать рост числа участников и активность через конкурс с
      условием вступить в сообщество и выполнить простое действие (репост/комментарий).
    steps:
      - "Определить приз и условия этапа, согласовав с владельцем сообщества (приз во входе не задан — «уточнить»)."
      - "Оформить конкурсный пост: правила, сроки, условия вступления и действия участника."
      - "Запустить продвижение конкурса (объявление в группе + при необходимости таргет)."
      - "Провести розыгрыш по прозрачным правилам, опубликовать итоги."
    metrics:
      - "Прирост подписчиков за период конкурса"
      - "Число участников (репостов/комментариев)"
      - "Охват конкурсного поста"
      - "Нет данных по призу/бюджету — во входе не указаны"
    risk: "Конкурс привлекает нецелевую «конкурсную» аудиторию и ботов; приз нужно уточнять, иначе невозможно оценить рентабельность. Возможны отписки после итогов."

  - type: "коллаборация"
    goal: >-
      Расширить охват за счёт обмена аудиторией с профильными сообществами
      смежной тематики (стройка, дом, дача) Екатеринбурга и области.
    steps:
      - "Подобрать 3–5 реальных профильных сообществ ВК (без выдуманных: из поиска по тематике «стройка/дом/твинблоки»)."
      - "Согласовать взаимный пост/гостевой материал (обмен публикациями или совместный эфир)."
      - "Провести совместный контент с призывом к вступлению в обе группы."
      - "Оценить переходы и прирост по каждому партнёрству."
    metrics:
      - "Прирост подписчиков из партнёрских групп"
      - "Охват совместных публикаций"
      - "Число переходов по ссылке на сообщество"
      - "Нет данных по целевым значениям"
    risk: "Партнёрство с чужим сообществом без проверки ЦА размывает фокус; нужен отбор по реальной тематике и охвату, иначе трафик нецелевой."

  - type: "прямые коммуникации (комментарии/сообщения)"
    goal: >-
      Увеличить число участников через личное цифровое общение с ЦА:
      ответы на вопросы, вовлечение в дискуссии, приглашение обсуждающих в группу.
    steps:
      - "Назначить модератора/админа для работы с комментариями и сообщениями сообщества."
      - "Отвечать на вопросы по твинблокам и стройке в течение канала связи (оперативность зафиксировать)."
      - "Вовлекать участников смежных веток обсуждений и внешних групп, приглашая их в сообщество с полезным контентом."
      - "Фиксировать часто задаваемые вопросы для контент-серии."
    metrics:
      - "Число сообщений/диалогов с участниками"
      - "Конверсия «диалог → подписка»"
      - "Время ответа"
      - "Прирост подписчиков за период"
      - "Нет данных по целевым значениям"
    risk: "Без SLA и модерации общение превращается в спам-рассылку и вредит репутации; требуется контроль тона и оперативности."

summary:
  total_mechanics: 5
  expected_impact: >-
    Метрики (число подписчиков, охват, вовлечённость) оцениваю без конкретных
    целевых значений — во входе статистики и бюджетов нет («нет данных»).
    Основной упор — на вовлечение (опросы, контент, прямые коммуникации) и рост
    числа участников (конкурс, коллаборации). Приз конкурса и бюджет — «уточнить»
    у владельца сообщества.

