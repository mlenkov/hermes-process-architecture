body:
  regulation:
    name: Разработка и усовершенствование регламента процесса подразделения организации
      или административного регламента подразделения организации
    standard_ref: '07.007'
    tf_code: А/02.6
    scope: Настоящий регламент определяет порядок выполнения процесса «Разработка
      и усовершенствование регламента процесса подразделения организации или административного
      регламента подразделения организации» в рамках профстандарта 07.007 «Специалист
      по процессному управлению», блок A — Регламентация процессов подразделений.
    terms:
    - term: Процесс
      definition: Совокупность последовательных операций, преобразующих входы в выходы
    - term: Регламент
      definition: Документ, устанавливающий порядок выполнения процесса
    - term: Трудовое действие
      definition: Элементарная операция в составе трудовой функции
  process_steps:
  - step_id: step-01
    name: Систематизация собранной информации о процессе подразделения организации
      или административном регламенте подразделения организации
    description: 'Выполнение трудового действия: Систематизация собранной информации
      о процессе подразделения организации или административном регламенте подразделения
      организации'
    inputs:
    - process-info-context
    outputs:
    - step-01-output
    skills_required: &id001
    - Агрегировать и обобщать собранную информацию
    - Выполнять классификацию процессов и объектов окружения процесса или административного
      регламента
    - Выявлять недостатки, несоответствия в функционировании процесса или административного
      регламента, формулировать и обосновывать предложения по их исправлению
    - Контролировать соответствие разработанных документов нормативно-методической
      документации
    - Оценивать ресурсы, необходимые для усовершенствования процессов или административных
      регламентов
    - Осуществлять коммуникации, проводить рабочие совещания, находить консенсус
    - Использовать программное обеспечение для разработки регламентов процессов или
      административных регламентов
    - Разрабатывать локальные нормативные акты в соответствии с нормативно-методическими
      документами
    - Разрабатывать схемы процессов или административных регламентов
  - step_id: step-02
    name: Разработка регламента процесса подразделения организации или административного
      регламента подразделения организации и регламентирующих документов (инструкций,
      положений)
    description: 'Выполнение трудового действия: Разработка регламента процесса подразделения
      организации или административного регламента подразделения организации и регламентирующих
      документов (инструкций, положений)'
    inputs:
    - step-01-output
    outputs:
    - step-02-output
    skills_required: *id001
  - step_id: step-03
    name: Разработка процедур контроля выполнения регламента процесса подразделения
      организации или административного регламента подразделения организации
    description: 'Выполнение трудового действия: Разработка процедур контроля выполнения
      регламента процесса подразделения организации или административного регламента
      подразделения организации'
    inputs:
    - step-02-output
    outputs:
    - step-03-output
    skills_required: *id001
  - step_id: step-04
    name: Разработка предложений по повышению эффективности процесса подразделения
      организации или административного регламента подразделения организации
    description: 'Выполнение трудового действия: Разработка предложений по повышению
      эффективности процесса подразделения организации или административного регламента
      подразделения организации'
    inputs:
    - step-03-output
    outputs:
    - step-04-output
    skills_required: *id001
  roles_responsibilities:
