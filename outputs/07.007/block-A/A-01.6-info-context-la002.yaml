body:
  standard_info:
    standard_name: 07.007 «Специалист по процессному управлению»
    block: A — Регламентация процессов подразделений
    total_labor_functions: 4
    labor_functions:
    - code: А/01.6
      name: Сбор информации о процессе подразделения организации с целью разработки
        регламента данного процесса или административного регламента подразделения
        организации
      level: 6
      actions:
      - Определение целей процесса подразделения организации или административного
        регламента подразделения организации
      - Определение границ процесса подразделения организации или административного
        регламента подразделения организации
      - Определение заинтересованных сторон, собственника и участников процесса подразделения
        организации или административного регламента подразделения организации
      - Определение входов и выходов процесса подразделения организации или начала
        и результата выполнения административного регламента подразделения организации
      - Выяснение последовательности выполнения работ в процессе подразделения организации
        или административном регламенте подразделения организации
      - Выяснение используемых ресурсов, Российского и международного законодательства,
        локальных нормативных актов, отчетных документов, необходимых для выполнения
        процесса подразделения организации или административного регламента подразделения
        организации
      - Выявление ответственных работников подразделения за каждую работу в процессе
        подразделения организации или административном регламенте подразделения организации
      - Сбор информации о действующей системе планирования и отчетности работы процесса
        подразделения организации или административного регламента подразделения организации
      - Сбор информации о ходе и результатах процесса подразделения организации или
        административного регламента подразделения организации
      - Оформление результатов сбора информации
      skills_required:
      - Анализировать информацию о границах процесса, требования к процессу, цели
        процесса или административного регламента
      - Анализировать зоны ответственности, заинтересованные стороны процесса, действующие
        нормативы, ресурсы, входы, выходы и показатели процесса или административного
        регламента
      - Анализировать состав и последовательность операций, составляющих процесс или
        административный регламент
      - Находить необходимые документы и информацию о процессе или административном
        регламенте в бумажном и электронном виде в информационных системах
      - Выполнять наблюдения, интервью и анкетирование
    - code: А/02.6
      name: Разработка и усовершенствование регламента процесса подразделения организации
        или административного регламента подразделения организации
      level: 6
      actions:
      - Систематизация собранной информации о процессе подразделения организации или
        административном регламенте подразделения организации
      - Разработка регламента процесса подразделения организации или административного
        регламента подразделения организации и регламентирующих документов (инструкций,
        положений)
      - Разработка процедур контроля выполнения регламента процесса подразделения
        организации или административного регламента подразделения организации
      - Разработка предложений по повышению эффективности процесса подразделения организации
        или административного регламента подразделения организации
      skills_required:
      - Агрегировать и обобщать собранную информацию
      - Выполнять классификацию процессов и объектов окружения процесса или административного
        регламента
      - Выявлять недостатки, несоответствия в функционировании процесса или административного
        регламента, формулировать и обосновывать предложения по их исправлению
      - Контролировать соответствие разработанных документов нормативно-методической
        документации
      - Оценивать ресурсы, необходимые для усовершенствования процессов или административных
        регламентов
      - Осуществлять коммуникации, проводить рабочие совещания, находить консенсус
      - Использовать программное обеспечение для разработки регламентов процессов
        или административных регламентов
      - Разрабатывать локальные нормативные акты в соответствии с нормативно-методическими
        документами
      - Разрабатывать схемы процессов или административных регламентов
    - code: А/03.6
      name: Ввод в действие регламента процесса подразделения организации или административного
        регламента подразделения организации
      level: 6
      actions:
      - Планирование мероприятий по вводу в действие регламента процесса подразделения
        организации или административного регламента подразделения организации
      - Внедрение в действие регламента процесса подразделения организации или административного
        регламента подразделения организации
      - Внедрение предложений по повышению эффективности процесса подразделения организации
        или административного регламента подразделения организации
      - Оценка эффективности мероприятий по вводу в действие регламента процесса подразделения
        организации или административного регламента подразделения организации
      skills_required:
      - Осуществлять коммуникации, проводить рабочие совещания, находить консенсус
      - Оценивать ресурсы, необходимые для ввода в действие регламентов процессов
        или административных регламентов или предложений по повышению их эффективности
      - Разрабатывать, согласовывать и утверждать планы мероприятий, оценивать достижение
        результатов, разрабатывать корректирующие мероприятия для достижения планов
      - Оказывать консультационную помощь работникам организации
    - code: А/04.6
      name: Контроль выполнения регламента процесса подразделения организации или
        административного регламента подразделения организации
      level: 6
      actions:
      - Определение процедур контроля выполнения регламента процесса подразделения
        организации или административного регламента подразделения организации
      - Сбор информации о ходе и результатах выполнения процесса подразделения организации
        или административного регламента подразделения организации
      - Анализ собранной информации на соответствие критериям, установленным для проведения
        контроля
      - Оценка эффективности процесса подразделения организации или административного
        регламента подразделения организации
      - Разработка рекомендаций по повышению эффективности процессов подразделения
        организации или административных регламентов подразделения организации
      - Оформление результатов контроля выполнения регламента процесса подразделения
        организации или административного регламента подразделения организации
      skills_required:
      - Выбирать контрольные точки, позволяющие оценивать степень выполнения регламентов
        и составлять планы контроля
      - Оценивать достоверность информации, полученной в ходе контроля
      - Анализировать показатели эффективности и результативности процессов и административных
        регламентов
      - Выявлять отклонения от установленных критериев и показателей функционирования
        процессов и административных регламентов
      - Рассчитывать эффективность процессов и административных регламентов
      - Выявлять потенциал повышения эффективности процесса или административного
        регламента
      - Формулировать и обосновывать предложения по повышению эффективности процессов
        или административных регламентов
      - Подготавливать отчеты, заключения по результатам контрольных мероприятий
