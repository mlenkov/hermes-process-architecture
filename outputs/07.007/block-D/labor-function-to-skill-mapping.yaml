      - "Выявление причин отклонений"
      - "Разработка предложений по устранению"
      - "Презентация предложений"
      - "Реализация мероприятий"
      - "Проверка эффективности"
    skill_path: "architect-selfheal/SKILL.md"
    coverage_status: covered
    coverage_note: >
      architect-selfheal выявляет отклонения (blocked/stuck задачи),
      анализирует причины, выполняет reclaim/reready, при N+1 ошибках
      эскалирует через pdca-reports. pdca-reporter дополняет
      gap-анализом. Покрытие достаточное.

