      - "Планирование аудита"
      - "Инструктаж участников"
      - "Проведение наблюдений"
      - "Анализ документов и данных"
      - "Оформление результатов"
      - "Презентация результатов"
    skill_path: "system-auditor/SKILL.md"
    coverage_status: partially_covered
    coverage_note: >
