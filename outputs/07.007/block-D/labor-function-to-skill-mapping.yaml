      артефактов, валидность YAML, timeout) и формирует отчёт аудита с
      рекомендациями. Статус partially_covered (не covered): аудируется
      проектирование handoff-точек, но runtime-логи исполнения (latency,
      фактическое выполнение триггеров) ещё не аудируются — это требует
      runtime-мониторинга, которого нет в архитектуре.
    required_new_skill: ""
    required_new_skill_rationale: ""

