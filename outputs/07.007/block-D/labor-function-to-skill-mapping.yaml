      partially_covered — граф строится, но не все ТФ имеют навыки
      и артефакты (gaps в pipeline).
    required_new_skill: ""
    required_new_skill_rationale: ""

  - tf_code: В/03.6
    tf_name: "Разработка и усовершенствование кросс-функционального процесса"
    tf_actions:
