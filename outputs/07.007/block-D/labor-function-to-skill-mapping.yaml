      - "Анализ на соответствие критериям"
      - "Оценка эффективности"
      - "Разработка рекомендаций"
      - "Оформление результатов контроля"
    skill_path: "pdca-reporter/SKILL.md"
    coverage_status: covered
    coverage_note: >
      pdca-reporter формирует PDCA-отчёт с gap-анализом, сравнивает
      фактические показатели coverage с целевыми, выдает рекомендации.
      architect-monitor собирает статистику выполнения.
      Покрытие достаточное для текущего уровня зрелости.

