    skill_path: "regulation-writer/SKILL.md"
    coverage_status: covered
    coverage_note: >
      regulation-writer читает process-info-context.yaml
      (от info-gatherer) и docs/standards/07.007/otf-section-1.yaml,
      генерирует process-regulation.yaml с шагами процесса, ролями
      и процедурами контроля. Создан по blueprint new-skill-architecture-blueprint.md.
    required_new_skill: ""
    required_new_skill_rationale: ""

  - tf_code: А/03.6
    tf_name: "Ввод в действие регламента"
    tf_actions:
