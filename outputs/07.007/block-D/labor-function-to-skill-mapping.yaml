      - "Внедрение регламента"
      - "Внедрение предложений по повышению эффективности"
      - "Оценка эффективности внедрения"
    skill_path: "deployment-planner/SKILL.md"
    coverage_status: covered
    coverage_note: >
      deployment-planner читает A-01.6-info-context.yaml,
      A-02.6-regulation.yaml и otf-section-1.yaml, генерирует
      deployment-plan.yaml с 4 фазами, gates, milestones,
