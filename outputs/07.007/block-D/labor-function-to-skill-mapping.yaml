      - "Оценка эффективности внедрения"
      - "Инструктаж персонала"
    skill_path: crossfunction-deployer/SKILL.md
    coverage_status: partially_covered
    coverage_note: >
      crossfunction-deployer читает B-03.6-crossfunction-spec.yaml,
      mapping и otf-section-2.yaml, генерирует план внедрения:
      deployment phases (4 ТД В/04.6), kanban tasks, handoff triggers,
