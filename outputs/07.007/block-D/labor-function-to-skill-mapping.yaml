      но инструктаж участников и проведение наблюдений (runtime)
      требуют human-in-the-loop (User_Operator).
    required_new_skill: ""
    required_new_skill_rationale: ""

  - tf_code: С/05.7
    tf_name: "Разработка предложений по устранению отклонений"
    tf_actions:
