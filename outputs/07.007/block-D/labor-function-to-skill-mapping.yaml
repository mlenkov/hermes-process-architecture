      - "Разработка предложений по повышению эффективности"
      - "Оформление результатов"
    skill_path: crossfunction-designer/SKILL.md
    coverage_status: partially_covered
    coverage_note: >
      crossfunction-designer превращает IDEF0-граф (В/02.6) в исполняемую
      спецификацию: process definition, handoff contracts, control points,
      profile responsibilities, efficiency proposals.
      Статус partially_covered — gates и timeout не заданы в графе, у ТФ В/03.6
      нет артефактов в registry (data_gaps в спецификации).
    required_new_skill: ""
    required_new_skill_rationale: ""

  - tf_code: В/04.6
    tf_name: "Внедрение кросс-функционального процесса"
    tf_actions:
