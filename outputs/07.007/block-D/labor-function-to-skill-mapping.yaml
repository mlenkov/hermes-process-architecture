# =============================================================================
# Карта: Трудовая функция → Навык (Skill)
# Профстандарт: 07.007 «Специалист по процессному управлению»
# Исполнитель: профиль mais (ADR-008)
# Версия: 1.0.0
# =============================================================================
#
# Легенда статусов:
#   covered             — существует SKILL.md, покрывающий ТФ полностью
#   partially_covered   — существует SKILL.md, покрывающий часть ТД
#   missing_skill       — нет SKILL.md, требуется создать
#   not_applicable      — ТФ не применима к агенту (выполняется человеком)
# =============================================================================

mappings:

