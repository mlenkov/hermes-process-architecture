# M-04. ТЗ на изменение структуры/содержания сайта
# ---------------------------------------------------------------------------
M-04:
  material_id: M-04
  type: site_structure_tz
  name: "ТЗ на внесение изменений в структуру и содержание веб-сайта"
  quantity: 1
  executor: "копирайтер (06.013) + dev/разметка (06.043)"
  changes:
    - id: CH-01
      where: "Главная страница — блок под первым экраном"
      what: "Добавить калькулятор твинблока (типоразмер → количество шт/куб → цена)"
      why: "Закрывает partial-запрос 'калькулятор твинблока' из семантики; снижает отказы, ведёт к заявке"
      metric: "CTR на кнопку 'Рассчитать', заявки с калькулятора"
      priority: high

    - id: CH-02
      where: "Отдельная страница 'Как выбрать блок'"
      what: "Создать страницу-сравнение твинблока с газоблоком/пеноблоком по фактам (прочность, геометрия, кладка, цена за куб)"
      why: "Закрывает informational-запрос 'отличие твинблока от газоблока'; повышает доверие как к эксперту"
      metric: "Позиции по informational-ключам, время на странице"
      priority: high

    - id: CH-03
      where: "Карточка товара 'Твинблок' — вкладка 'Сертификаты'"
      what: "Выложить сканы сертификатов качества отдельным блоком/вкладкой"
      why: "Подтверждает УТП 'сертификаты качества' фактом, а не словами; усиливает конверсию в заявку"
      metric: "Клики на вкладку, заявки с карточки"
      priority: medium

    - id: CH-04
      where: "Посадочная страница (M-03) — блок 'Альбом технических решений'"
      what: "Прикрепить PDF альбома технических решений по кладке"
      why: "Закрывает запрос 'альбом технических решений'; помогает бригадам и застройщикам, снижает вопросы"
      metric: "Скачивания альбома, время на странице"
      priority: medium

    - id: CH-05
      where: "Посадочная страница (M-03) — блок отзывов"
      what: "Добавить реальные отзывы клиентов с фото объектов и меткой города/района"
      why: "Закрывает запрос 'твинблок отзывы'; социальное доказательство для частных застройщиков"
      metric: "Прокрутки до блока отзывов, конверсия в заявку"
      priority: medium

    - id: CH-06
      where: "Шапка/контакты на всех страницах"
      what: "Сделать телефон и адрес склада кликабельными и видимыми без прокрутки на мобильной версии"
      why: "КМ-трафик с телефона: застройщик звонит сразу; снижает потери на форме"
      metric: "Звонки из рекламы (коллтрекинг)"
      priority: high

  forbidden: "Размытые формулировки без адресации к странице и метрике"

