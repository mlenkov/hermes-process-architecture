otf:
  code: Е
  name: Реализация контекстно-медийной стратегии продвижения в информационно- телекоммуникационной
    сети "Интернет"
  level: '5'
labor_functions:
- code: Е/01.5
  name: Проведение анализа готовности веб-сайта к продвижению, анализ веб-сайтов конкурентов
  трудовые_действия:
  - Проведение базового аудита эргономичности (юзабилити) веб-сайта и действующих
    контекстно-медийных кампаний по продвижению вебсайта
  - Анализ готовности веб-сайта к контекстно-медийным кампаниям и составление аналитической
    записки
  - Анализ веб-сайтов и рекламных кампаний конкурентов в системах контекстно-медийной
    рекламы
- code: Е/02.5
  name: Разработка стратегии проведения контекстно-медийной кампании
  трудовые_действия:
  - Подбор площадок для размещения объявлений
  - Разработка стратегии мотивации пользователей для возвращения на веб-сайт
  - Подбор времени показа объявлений
  - Подбор территории показа объявлений
- code: Е/03.5
  name: Составление заданий на разработку текстовых и графических материалов для контекстно-медийной
    стратегии продвижения в информационно- телекоммуникационной сети "Интернет"
  трудовые_действия:
  - Составление технических заданий на внесение изменений в структуру и содержание
    веб-сайта
  - Составление технических заданий по написанию и редактированию текстов для рекламируемых
    страниц веб-сайта
  - Составление технических заданий дизайнеру по подготовке медийного контента для
    объявлений
- code: Е/04.5
  name: Составление отчетов по реализации контекстно-медийной стратегии продвижения
    в информационно- телекоммуникационной сети "Интернет"
  трудовые_действия:
  - Анализ использования информационных, навигационных и функциональных элементов
    страниц веб-сайта посетителями, пришедшими по ссылкам из систем контекстно-медийной
    рекламы
  - Анализ показателей эффективности проведения контекстно-медийной рекламной кампании
  - Составление отчетов по результатам работы
