otf:
  code: J
  name: Управление реализацией стратегии интернет-продвижения
  level: '6'
labor_functions:
- code: J/01.6
  name: Проведение работ по реализации стратегии продвижения в информационно- телекоммуникационной
    сети "Интернет"
  трудовые_действия:
  - Составление технических заданий на установку кодов счетчиков веб-аналитики на
    веб-сайт
  - Составление заданий специалистам на реализацию стратегии продвижения
  - Контроль реализации стратегии специалистами
  - Контроль показателей эффективности продвижения, согласованных с заказчиком
- code: J/02.6
  name: Организация и проведение электронных рассылок
  трудовые_действия:
  - Составление плана электронных рассылок
  - Подбор площадки для проведения почтовой рассылки
  - Составление технического задания на подготовку текста почтовой рассылки
  - 'Организация работ по рассылке электронных писем: составление письма, корректировка
    письма, выбор программы для рассылки, сбор контактов для рассылки, рассылка, сбор
    результатов по доставленным письмам'
  - Анализ показателей эффективности электронной рассылки
- code: J/03.6
  name: Корректировка стратегии продвижения
  трудовые_действия:
  - Оперативный сбор информации о результатах реализации стратегии продвижения
  - Выявление расхождений между текущими и планируемыми показателями продвижения
  - Выявление причин расхождений между текущими и планируемыми показателями продвижения
  - Внесение изменений в стратегию продвижения
- code: J/04.6
  name: Составление отчетности по реализации стратегии продвижения в информационно-
    телекоммуникационной сети "Интернет"
  трудовые_действия:
  - Проведение анализа результатов реализации стратегии продвижения
  - Составление аналитической записки по результатам реализации стратегии продвижения
  - Составление рекомендаций по реализации стратегии продвижения в последующие периоды
    времени
