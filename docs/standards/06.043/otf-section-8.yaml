otf:
  code: Н
  name: Проведение исследований в информационно- телекоммуникационной сети "Интернет"
  level: '6'
labor_functions:
- code: Н/01.6
  name: Исследование поведения конкурентов в информационно- телекоммуникационной сети
    "Интернет"
  трудовые_действия:
  - Проведение исследований веб-сайтов конкурентов
  - Проведение исследований каналов продвижения конкурентов и бюджетов реализации
    продвижения
  - Составление аналитической записки на основе исследования поведения конкурентов
- code: Н/02.6
  name: Исследование поведения пользователей в информационно- телекоммуникационной
    сети "Интернет"
  трудовые_действия:
  - Исследование поведения посетителей веб-сайта
  - Выявление и составление списка конкурирующих веб-сайтов
  - Составление аналитической записки на основе исследований поведения посетителей
    на веб-сайтах
- code: Н/03.6
  name: Исследование спроса в информационно-телекоммуникационной сети "Интернет"
  трудовые_действия:
  - Проведение исследования спроса в информационно-телекоммуникационной сети "Интернет"
  - Анализ тенденции изменения спроса
  - Прогнозирование изменения спроса на основе аналитических данных, предоставляемых
    сервисами поисковых машин
