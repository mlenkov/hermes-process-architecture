otf:
  code: K
  name: Стратегическое планирование интернет-кампаний
  level: '7'
labor_functions:
- code: K/01.7
  name: Проведение переговоров с заказчиком по вопросам продвижения в информационно-
    телекоммуникационной сети "Интернет"
  трудовые_действия:
  - Проведение переговоров с целью выявления объекта продвижения и ожидаемых от продвижения
    результатов
  - Определение целей продвижения
  - Согласование договора на реализацию стратегии продвижения
- code: K/02.7
  name: Разработка системы показателей, характеризующих эффективность продвижения
    проекта, и формирование стратегии продвижения в информационно- телекоммуникационной
    сети "Интернет"
  трудовые_действия:
  - Составление системы показателей, необходимых и достаточных для анализа эффективности
    продвижения проекта
  - Разработка этапов реализации стратегии продвижения
  - Определение соответствия между этапами реализации стратегии продвижения и системой
    показателей, характеризующих эффективность продвижения проекта
  - Определение базовых значений для каждого показателя системы
  - Планирование результатов реализации стратегии продвижения
- code: K/03.7
  name: Составление стратегии продвижения проекта в информационно- телекоммуникационной
    сети "Интернет"
  трудовые_действия:
  - Составление заданий для формирования договоров на продвижение
  - Анализ работы сотрудников по реализации стратегии продвижения проекта в информационно-телекоммуникационной
    сети "Интернет"
  - Корректировка деятельности сотрудников
  - Определение ключевых показателей эффективности продвижения
- code: K/04.7
  name: Формирование и обоснование бюджета продвижения проекта в информационно- телекоммуникационной
    сети "Интернет"
  трудовые_действия:
  - Оценка финансовых возможностей заказчика и экономического эффекта от реализации
    стратегии продвижения
  - Определение основных направлений расходования средств согласно разработанной стратегии
    продвижения
  - Обоснование расходов с использованием системы показателей эффективности продвижения
- code: K/05.7
  name: Контроль реализации стратегии продвижения в информационно- телекоммуникационной
    сети "Интернет"
  трудовые_действия:
  - Выявление расхождений между планируемыми и достигнутыми значениями показателей
    эффективности продвижения
  - Определение причин выявленных расхождений между планируемыми и достигнутыми значениями
    показателей эффективности продвижения
  - Внесение оперативных изменений в реализацию стратегии продвижения с учетом выявленных
    причин расхождений
- code: K/06.7
  name: Составление отчетности о реализации стратегии продвижения проекта в информационно-
    телекоммуникационной сети "Интернет"
  трудовые_действия:
  - Составление отчетов о реализации стратегии продвижения проекта заказчика в информационно-телекоммуникационной
    сети "Интернет"
  - Согласование отчетов для заказчика
  - Корректировка стратегии продвижения в информационно- телекоммуникационной сети
    "Интернет" совместно с заказчиком
