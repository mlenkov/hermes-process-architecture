otf:
  code: В
  name: Проведение подготовительных работ для контекстно-медийного продвижения в информационно-
    телекоммуникационной сети "Интернет"
  level: '4'
labor_functions:
- code: В/01.4
  name: Составление контекстно-медийного плана продвижения
  трудовые_действия:
  - Подбор ключевых слов и словосочетаний для показа контекстно-медийных объявлений
  - Оценка подобранных ключевых слов и словосочетаний с точки зрения их соответствия
    тематике рекламируемого веб-сайта
  - Составление текстов рекламных объявлений в контекстно-медийной сети
- code: В/02.4
  name: Размещение контекстно-медийных объявлений в системах интернет- рекламы
  трудовые_действия:
  - Оценка мест размещения контекстно-медийных рекламных объявлений с точки зрения
    их соответствия целям рекламной кампании
  - Размещение текстовых рекламных объявлений в контекстно-медийной системе
  - Размещение медийных рекламных объявлений в контекстно-медийной системе
- code: В/03.4
  name: Управление стоимостью перехода пользователя с рекламной площадки контекстно-медийной
    системы на веб-сайт
  трудовые_действия:
  - Оценка стоимости перехода пользователя с рекламной площадки контекстно-медийной
    системы на веб-сайты конкурентов
  - Сравнение текущей стоимости перехода на рекламируемый веб-сайт с планируемой стоимостью
    перехода
  - Изменение стоимости перехода на рекламируемый веб-сайт с рекламной площадки контекстно-медийной
    системы
