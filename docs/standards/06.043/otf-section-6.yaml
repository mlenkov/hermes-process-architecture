otf:
  code: F
  name: Реализация медийной стратегии продвижения в информационно-телекоммуникационной
    сети "Интернет"
  level: '5'
labor_functions:
- code: F/01.5
  name: Проведение аналитических работ по реализации медийной стратегии продвижения
    в информационно- телекоммуникационной сети "Интернет"
  трудовые_действия:
  - Проведение базового аудита эргономичности (юзабилити) веб-сайта
  - Анализ готовности веб-сайта к медийным кампаниям и составление аналитической записки
  - Анализ веб-сайтов конкурентов, использующих медийную рекламу для своего продвижения
- code: F/02.5
  name: Разработка стратегии проведения медийной кампании и ее реализация
  трудовые_действия:
  - Составление плана медиапродвижения
  - Разработка стратегии таргетирования показа рекламных баннеров
  - Подбор площадок для размещения медийной рекламы
  - Размещение медийных баннеров на площадках
- code: F/03.5
  name: Составление заданий на разработку текстовых и графических материалов для медийной
    стратегии продвижения в информационно-телекоммуникационной сети "Интернет"
  трудовые_действия:
  - Составление технических заданий на внесение изменений в структуру и содержание
    веб-сайта
  - Составление технических заданий по составлению и редактированию текстов для рекламируемых
    страниц веб-сайта
  - Составление технических заданий дизайнеру по подготовке медийного контента
- code: F/04.5
  name: Составление отчетов по реализации медийной стратегии продвижения в информационно-телекоммуникационной
    сети "Интернет"
  трудовые_действия:
  - Анализ использования информационных, навигационных и функциональных элементов
    страниц веб-сайта посетителями, пришедшими по ссылкам из систем медийной рекламы
  - Анализ показателей эффективности проведения медийной кампании
  - Составление отчетов по результатам проведения медийной рекламной кампании
