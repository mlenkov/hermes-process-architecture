otf:
  code: L
  name: Управление персоналом в подразделении интернет-маркетинга
  level: '7'
labor_functions:
- code: L/01.7
  name: Разработка системы мотивации специалистов по интернет-маркетингу
  трудовые_действия:
  - Анализ конъюнктуры рынка рабочей силы
  - Разработка и внедрение системы качественных показателей, характеризующих деятельность
    специалистов по интернет-маркетингу
  - Разработка и внедрение системы материального и нематериального стимулирования
    работы сотрудников подразделения интернет-маркетинга
- code: L/02.7
  name: Формирование требований к составу и квалификации специалистов по интернет-
    маркетингу
  трудовые_действия:
  - Разработка организационно-правовой документации для специалистов по интернет-маркетингу
  - Составление требований к кандидатам, претендующим на работу в подразделении интернет-маркетинга
- code: L/03.7
  name: Управление специалистами по интернет-маркетингу и контроль их работы
  трудовые_действия:
  - Формирование у сотрудников четкого представления о роли их работы в деятельности
    организации
  - Определение степени занятости сотрудников
  - Создание комфортных условий для работы сотрудников подразделения
  - Контроль выполняемой работы
  - Разработка и реализация систем материальной и нематериальной мотивации работы
    сотрудников
