otf:
  code: А
  name: Проведение подготовительных работ для поискового продвижения в информационно-
    телекоммуникационной сети "Интернет"
  level: '4'
labor_functions:
- code: А/01.4
  name: Составление списка ключевых слов, отражающих специфику веб-сайта
  трудовые_действия:
  - Первичное составление списка ключевых слов и словосочетаний, отражающих специфику
    веб-сайта
  - Расширение и изменение списка ключевых слов, отражающих специфику веб-сайта
  - Оценка подобранных словосочетаний с точки зрения их соответствия тематике веб-сайта
- code: А/02.4
  name: Проведение работ по внутренней оптимизации веб-сайта согласно требованиям
    поисковых систем
  трудовые_действия:
  - Размещение текстов на веб-сайте с учетом факторов внутренней поисковой оптимизации
  - Оптимизация гипертекстовой разметки веб-сайта
  - Оптимизация метаинформации страницы
- code: А/03.4
  name: Проведение работ по повышению популярности веб-сайта в информационно-телекоммуникационной
    сети "Интернет"
  трудовые_действия:
  - Подбор площадок для размещения информации о продвигаемом вебсайте
  - Оценка подобранных площадок с точки зрения их соответствия тематике продвигаемого
    веб-сайта
  - Размещение информации о продвигаемом веб-сайте на выбранных площадках
