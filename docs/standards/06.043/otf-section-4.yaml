otf:
  code: D
  name: Реализация стратегии поискового продвижения в информационно- телекоммуникационной
    сети "Интернет"
  level: '5'
labor_functions:
- code: D/01.5
  name: Проведение аудита веб-сайта
  трудовые_действия:
  - Проведение технического анализа аудируемого веб-сайта
  - Проведение базового аудита эргономичности (юзабилити) аудируемого веб-сайта
  - Проведение аудита визуально-эстетического решения аудируемого вебсайта
- code: D/02.5
  name: Проведение аналитических работ по реализации стратегии поискового продвижения
    в информационно- телекоммуникационной сети "Интернет"
  трудовые_действия:
  - Анализ поисковой выдачи
  - Анализ веб-сайтов конкурентов из поисковой выдачи
  - Анализ поведения пользователей при поиске необходимой информации в информационно-телекоммуникационной
    сети "Интернет"
- code: D/03.5
  name: Разработка стратегии поискового продвижения
  трудовые_действия:
  - Составление стратегии поискового продвижения
  - Проверка и корректировка списка ключевых слов и словосочетаний,
  - используемых при поисковом продвижении
  - Согласование стратегии поискового продвижения с интернет-
  - маркетологом
- code: D/04.5
  name: Организация коррекции ошибок в работе веб-сайта
  трудовые_действия:
  - Составление технических заданий для веб-программистов и веб-верстальщиков по внесению
    изменений в код веб-сайта
  - Составление технических заданий для написания текстов, размещаемых на веб-сайте
  - Оценка и корректировка выполненных заданий
- code: D/05.5
  name: Оптимизация внутренних характеристик веб-сайта, повышение его популярности
    в информационно-телекоммуникационной сети "Интернет" и анализ поведения посетителей
    веб-сайта
  трудовые_действия:
  - Анализ поведения посетителей веб-сайта
  - Составление заданий на внесение изменений в веб-сайт с целью улучшения поведенческих
    факторов
  - Анализ внешних факторов, влияющих на популярность веб-сайта в информационно-телекоммуникационной
    сети "Интернет"
- code: D/06.5
  name: Составление отчетов по реализации стратегии поискового продвижения в информационно-
    телекоммуникационной сети "Интернет"
  трудовые_действия:
  - Сбор статистических и аналитических данных
  - Составление отчетов по результатам работы
  - Оформление отчетов для представления их владельцу веб-сайта
