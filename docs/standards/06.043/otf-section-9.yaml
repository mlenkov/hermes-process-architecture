otf:
  code: I
  name: Разработка стратегии продвижения в информационно-телекоммуникационной сети
    "Интернет"
  level: '6'
labor_functions:
- code: I/01.6
  name: Подбор каналов и формирование системы показателей эффективности продвижения
    в информационно- телекоммуникационной сети "Интернет"
  трудовые_действия:
  - Подбор каналов продвижения в информационно-телекоммуникационной сети "Интернет"
  - Разработка показателей эффективности продвижения в информационно- телекоммуникационной
    сети "Интернет"
  - Составление стратегии продвижения в информационно- телекоммуникационной сети "Интернет"
- code: I/02.6
  name: Согласование с заказчиком показателей эффективности и бюджета кампании по
    продвижению в информационно- телекоммуникационной сети "Интернет"
  трудовые_действия:
  - Согласование показателей эффективности и стратегии продвижения с заказчиком
  - Формирование бюджета на продвижение в информационно- телекоммуникационной сети
    "Интернет"
  - Распределение бюджета на продвижение в информационно- телекоммуникационной сети
    "Интернет" между различными каналами продвижения
- code: I/03.6
  name: Анализ трафика на веб-сайт
  трудовые_действия:
  - Проведение анализа количественных показателей трафика на веб-сайт
  - Проведение анализа качественных показателей трафика на веб-сайт
  - Составление аналитической записки по анализу существующего трафика на веб-сайт
