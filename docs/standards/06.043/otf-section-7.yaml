otf:
  code: G
  name: Реализация стратегии социального продвижения в информационно- телекоммуникационной
    сети "Интернет"
  level: '5'
labor_functions:
- code: G/01.5
  name: Проведение аналитических работ по изучению конкурентов
  трудовые_действия:
  - Анализ и мониторинг информационного поля бренда, личности, организации
  - Поиск и анализ конкурирующих субъектов, присутствующих в социальных медиа
  - Составление аналитической записки по проведенному анализу
- code: G/02.5
  name: Разработка стратегии продвижения в социальных медиа
  трудовые_действия:
  - Выбор площадок в социальных медиа для продвижения веб-сайта
  - Составления списка тем в предметной области веб-сайта для обсуждения посетителями
    площадок и членов интернет-сообществ в социальных медиа
  - Составление примеров информационных сообщений (постов) для размещения в социальных
    медиа
  - Составление календарного плана информационных сообщений (постов) для размещения
    в социальных медиа
  - Составление календарного плана проведения мероприятий в социальных медиа
- code: G/03.5
  name: Составление заданий по подготовке материалов для продвижения в социальных
    медиа
  трудовые_действия:
  - Составление технических заданий копирайтерам на подготовку текстовых материалов
    для размещения в социальных медиа
  - Составление технических заданий дизайнерам на подготовку графических материалов
    для размещения в социальных медиа
  - Разработка сценариев видеоматериалов для размещения в социальных медиа и составление
    технического задания на их съемку
- code: G/04.5
  name: Привлечение пользователей в интернет-сообщество
  трудовые_действия:
  - Общение с представителями целевой аудитории с использованием цифровых методов
    связи
  - Проведение конкурсов в социальных медиа
  - Проведение опросов в социальных медиа
  - Осуществление деятельности в информационно-телекоммуникационной сети "Интернет",
    увеличивающей количество пользователей в интернет-сообществе
- code: G/05.5
  name: Проведение рекламных кампаний в социальных медиа
  трудовые_действия:
  - Подбор рекламных площадок в социальных медиа для заданного вебсайта
  - Составление медиаплана проведения рекламной кампании
  - Разработка стратегии таргетирования показа рекламных объявлений
- code: G/06.5
  name: Составление отчетов по реализации стратегии социального продвижения в информационно-
    телекоммуникационной сети "Интернет"
  трудовые_действия:
  - Анализ использования информационных, навигационных и функциональных элементов
    страниц веб-сайта посетителями, пришедшими по ссылкам из социальных медиа
  - Анализ показателей эффективности проведения мероприятий по продвижению в социальных
    медиа
  - Составление отчетов по результатам работы с социальными медиа
