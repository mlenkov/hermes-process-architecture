otf:
  code: С
  name: Проведение подготовительных работ для продвижения в социальных медиа информационно-телекоммуникационной
    сети "Интернет"
  level: '4'
labor_functions:
- code: С/01.4
  name: Подбор площадок в социальных медиа информационно-телекоммуникационной сети
    "Интернет" для продвижения вебсайта
  трудовые_действия:
  - Составление списка площадок в социальных медиа информационно-телекоммуникационной
    сети "Интернет"
  - Оценка соответствия тематики продвигаемого ресурса и площадки в социальных медиа
    информационно-телекоммуникационной сети "Интернет"
  - Составление отчета об условиях размещения информации на подобранных площадках
    в социальных медиа информационно-телекоммуникационной сети "Интернет"
- code: С/02.4
  name: Управление коммуникациями в социальных медиа информационно- телекоммуникационной
    сети "Интернет"
  трудовые_действия:
  - Регистрация и оформление сообществ в социальных медиа информационно- телекоммуникационной
    сети "Интернет"
  - Размещение информационных сообщений на площадках в социальных медиа информационно-телекоммуникационной
    сети "Интернет"
  - Реагирование на вопросы и комментарии участников сообществ в социальных медиа
    информационно-телекоммуникационной сети "Интернет"
- code: С/03.4
  name: Размещение рекламных объявлений в социальных медиа информационно- телекоммуникационной
    сети "Интернет"
  трудовые_действия:
  - Оценка мест размещения контекстно-медийных рекламных объявлений в социальных медиа
    с точки зрения их соответствия целям рекламной кампании
  - Размещение текстовых рекламных объявлений в социальных медиа информационно-телекоммуникационной
    сети "Интернет"
  - Размещение медийных рекламных объявлений в социальных медиа информационно-телекоммуникационной
    сети "Интернет"
