otf:
  code: B
  name: Создание и редактирование информационных ресурсов
  level: '5'
labor_functions:
- code: B/01.5
  name: Подбор информации по тематике сайта
  трудовые_действия:
  - Выявление потенциальных источников информации (среди сайтов производителей и основных
    дистрибьюторов товаров, конкурентов, тематических сообществ и форумов, электронных
    и печатных каталогов и справочников, информационных систем и баз данных организации)
  - Поиск и извлечение (копирование, сохранение) недостающей графической и (или) текстовой
    информации
  - Поиск информации о новых товарах и услугах для актуализации (пополнения) сайта
    новыми сведениями
  - Мониторинг новостных лент, форумов, социальных сетей, рассылок
- code: B/02.5
  name: Создание информационных материалов для сайта
  трудовые_действия:
  - Переработка текстов различной тематики (рерайт)
  - Написание статей, обзоров и других текстов на заданную тематику (копирайтинг)
  - Поисковая оптимизация и адаптация текстовых материалов
  - Актуализация и расширение знаний по тематике информационных ресурсов
- code: B/03.5
  name: Редактирование информации на сайте
  трудовые_действия:
  - Контроль качества и содержания текстов и отображения веб-страниц сайта с целью
    определения необходимости редакторской и корректорской обработки
  - Редактирование текстов и корректировка отображения веб-страниц
  - Формирование заданий для исправления веб-писателям, веб-дизайнерам и веб-разработчикам
  - Адаптирование текстовых материалов для внутренней поисковой оптимизации
  - Актуализация и расширение знаний по тематике информационных ресурсов
- code: B/04.5
  name: Ведение новостных лент и представительств в социальных сетях
  трудовые_действия:
  - Мониторинг изменений на сайте организации, выявление наиболее значимых обновлений
  - Поиск и мониторинг тематических сайтов для выявления новой, значимой и актуальной
    информации
  - Составление кратких и развернутых текстов объявлений для размещения на сайте,
    в социальных сетях, на форумах и тематических порталах
  - Подбор графических иллюстраций на веб-страницы для повышения конверсии
  - Размещение новостей на сайте и в социальных сетях, контроль правильности работы
    RSS-каналов и механизмов кросспостинга
  - Настройка отображения новостей, анонсов мероприятий и других элементов на сайтах
    социальных сетей
  - Сбор и обработка материалов для электронных рассылок
  - Работать с большими объемами информации
- code: B/05.5
  name: Модерирование обсуждений на сайте, форуме и в социальных сетях
  трудовые_действия:
  - Обработка комментариев пользователей, подготовка оперативных ответов или поручение
    этой задачи сотрудникам организации
  - Анализ и корректировка ответов, подготовленных представителями организации
  - Ведение базы данных и отчетов по обращениям, вопросам, жалобам
  - Модерирование сообщений и комментариев пользователей
  - Контроль и удаление нежелательного контента
  - Управление несколькими сообществами в социальных сетях
  - Управление дискуссиями с участниками сообществ
  - Проведение мероприятий для повышения посещаемости сайта, форума и страниц организации
    в социальных сетях, ослабления негативных реакций, поддержания дружелюбной тональности
    в комментариях к официальным сообщениям организации
  - Настройка параметров форума и управление характеристиками постоянных пользователей
  - Совершенствование процессов модерации
- code: B/06.5
  name: Нормативный контроль содержания сайта
  трудовые_действия:
  - Анализ материалов сайта на соответствие возрастным ограничениям
  - Контроль соблюдения прав интеллектуальной собственности на веб-сайтах, где контент
    формируется пользователями
  - Контроль соблюдения стандартов отрасли для специализированных и отраслевых сайтов,
    установленных законодательством Российской Федерации, локальными актами организации
  - Контроль размещения персональных данных
  - Контроль соблюдения требований стандартов к доступности интернет-ресурсов для
    лиц с ограниченными возможностями
  - Проверка содержания сайта на соответствие иным требованиям законодательства Российской
    Федерации и нормативов организации
