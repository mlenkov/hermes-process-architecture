otf:
  code: C
  name: Управление информационными ресурсами
  level: '6'
labor_functions:
- code: C/01.6
  name: Организация работ по созданию и редактированию контента сайтов
  трудовые_действия:
  - Планирование работ по наполнению сайта
  - Подготовка заданий для исполнителей
  - Распределение работы по созданию и редактированию контента
  - Координация работы по созданию и редактированию контента
  - Мониторинг и оценка результатов выполнения работ, формулирование замечаний
  - Документирование сведений о процессах и результатах выполнения работ исполнителями
- code: C/02.6
  name: Управление информацией из различных источников
  трудовые_действия:
  - Формирование запросов и получение информации от сотрудников организации
  - Согласование и утверждение информационных материалов
  - Передача информационных материалов, замечаний, исправлений между специалистами
    по информационным ресурсам и сотрудниками организации
  - Мониторинг появления новой или необходимой информации внутри организации, в информационно-телекоммуникационной
    сети "Интернет" и других источниках
  - Общая оценка значимости и приоритетности получаемой информации
- code: C/03.6
  name: Контроль за наполнением сайта
  трудовые_действия:
  - Оценка полноты сайта, его разделов, представительств в социальных сетях и определение
    необходимости его пополнения
  - Оценка актуальности материалов на сайте и определение необходимости их обновления
  - Формирование задания для устранения выявленных недостатков
- code: C/04.6
  name: Организация работ по изменению структуры сайта
  трудовые_действия:
  - Выявление необходимости изменения структуры сайта или его разделов
  - Оценка возможности внесения локальных изменений, не требующих обращения к веб-мастеру
  - Изменение структуры сайта с помощью системы управления контентом \- создание новых
    разделов, подразделов
  - Перемещение информационных ресурсов в новые разделы, удаление из существующих
    разделов
  - Проверка правильности отображения внесенных изменений
- code: C/05.6
  name: Анализ информационных потребностей посетителей сайта
  трудовые_действия:
  - Общий анализ посещаемости сайта, в том числе с использованием инструментальных
    средств
  - Выявление наиболее популярных страниц
  - Определение обобщенных характеристик аудитории сайта
  - Анализ оценки, замечаний, жалоб и предложений посетителей сайта
  - Оценка эффективности работы сайта на основе имеющихся данных
  - Выработка решения (рекомендации) по наполнению сайта контентом
- code: C/06.6
  name: Подготовка отчетности по сайту
  трудовые_действия:
  - Документирование работ по управлению информационными ресурсами сайта
  - Фиксирование и анализ результатов выполнения заданий, проектной информации
  - Обработка результатов аналитической деятельности
  - Сбор дополнительных материалов
  - Подготовка итоговой отчетности
- code: C/07.6
  name: Поддержка процессов модернизации и продвижения сайта
  трудовые_действия:
  - Внутренняя поисковая оптимизация информационных ресурсов
  - Формирование предложений по развитию сайта
  - Поддержание процессов проектирования сайта и анализа требований пользователей,
    бизнес-требований, существующей структуры и содержания веб-сайта
  - Поддержание процессов разработки и тестирования новой функциональности веб-сайта,
    систем управления контентом
  - Поддержание процессов опытной эксплуатации веб-сайта
