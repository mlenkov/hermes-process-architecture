otf:
  code: A
  name: Техническая обработка и размещение информационных ресурсов на сайте
  level: '4'
labor_functions:
- code: A/01.4
  name: Ввод и обработка текстовых данных для сайтов
  трудовые_действия:
  - Набор и редактирование текста
  - Сканирование и распознавание текста
  - Разметка и форматирование документов
  - Сохранение, копирование и резервирование документов
  - Преобразование и перекомпоновка данных, связанные с изменениями структуры документов,
    форм и требований к оформлению
  - Сохранение документов в различных компьютерных форматах
- code: A/02.4
  name: Сканирование и обработка графической информации
  трудовые_действия:
  - Настройка оборудования и программного обеспечения для сканирования
  - Подготовка материалов для сканирования
  - Определение параметров сканирования
  - Сканирование документов, сохранение, перемещение и резервное копирование файлов
    с изображениями
  - Обработка изображений (масштабирование, кадрирование, изменение разрешения и палитры)
  - Сохранение изображений в различных форматах и оптимизация их для публикации в
    информационно-телекоммуникационной сети "Интернет"
- code: A/03.4
  name: Ведение информационных баз данных
  трудовые_действия:
  - Ввод информации об объектах (товарах, услугах, персоналиях) в базу данных
  - Сверка сведений в базе данных с реальной ситуацией в организации и с текущими
    документами (прайс-листами, каталогами)
  - Формирование запросов для получения недостающей информации
  - Регулярное обновление (актуализация) информации в базах данных
  - Защита персональных данных, содержащихся в базах данных, согласно требованиям
    законодательства Российской Федерации
- code: A/04.4
  name: Размещение информации на сайте
  трудовые_действия:
  - Публикация на сайте и обновление информационных материалов через системы управления
    контентом
  - Форматирование (визуальное \- внесение необходимой и удаление лишней информации)
    и настройка отображения веб-страниц
  - Внесение служебной информации (названий и идентификаторов страниц, ключевых слов,
    мета-тегов)
  - Настройка внутренних связей между информационными блоками/ страницами в системе
    управления контентом
  - Установка прав доступа веб-страниц, информационных ресурсов для просмотра и скачивания
  - Проверка правильности отображения веб-страниц в браузерах на устройствах с различным
    разрешением
