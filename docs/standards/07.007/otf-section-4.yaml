type: generalized_labor_function
id: OTF-D
code: D
name: Проектирование и трансформация процессной архитектуры организации
job_titles: Процессный архитектор
origin:
- "Оригинал"
- "Заимствовано из оригинала"

labor_functions:
- type: labor_function
  id: TF-D-01-7
  code: D/01.7
  name: Анализ процессной архитектуры организации
  origin:
  - "Оригинал"
  - "Заимствовано из оригинала"
  job_titles: Процессный архитектор
  трудовые_действия:
  - "Определение заинтересованных сторон в проектировании и трансформации процессной архитектуры организации"
  - "Согласование с заинтересованными сторонами целей проектирования процессной архитектуры организации"
  - "Определение требований к процессной архитектуре организации исходя из структуры бизнеса, целей и стратегии организации"
  - "Сбор информации о процессной архитектуре организации"
  - "Анализ соответствия существующей процессной архитектуры организации требованиям, определенным к процессной архитектуре организации исходя из структуры бизнеса, целей и стратегии организации"
  - "Выявление возможностей усовершенствования процессной архитектуры организации"
  - "Оформление результатов анализа процессной архитектуры организации"
  - "Презентация результатов анализа процессной архитектуры организации"
  необходимые_умения:
  - "Анализировать цели и стратегию организации"
  - "Производить сравнительный анализ (бенчмаркинг) вариантов процессной архитектуры организации"
  - "Анализировать взаимосвязи между процессами"
  - "Осуществлять коммуникации, проводить рабочие совещания, находить консенсус"
  - "Анализировать, систематизировать и обобщать информацию"
  - "Подготавливать и проводить презентации"
  - "Использовать программное обеспечение для моделирования архитектуры процессов"
  необходимые_знания:
  - "Принципы и методы стратегического планирования"
  - "Методы структурной декомпозиции процессов"
  - "Принципы и методы трансляции целей организации в показатели процессов"
  - "Принципы классификации процессов"
  - "Принципы системного подхода"
  - "Методы и средства моделирования процессной архитектуры"
  - "Нотации моделирования процессов"
  - "Референтные модели процессной архитектуры"

  execution:
    recommended_profile: mais
    inputs:
      - id: architecture-current
        description: Текущая процессная архитектура организации
        source_tf: null
      - id: business-strategy
        description: Цели и стратегия организации
        source_tf: null
    outputs:
      - id: architecture-analysis
        description: "Результаты анализа: требования, несоответствия, возможности"
        target_tf: [D/02.7, D/04.7]

    actions:
      - index: 0
        text: "Определение заинтересованных сторон в проектировании и трансформации процессной архитектуры организации"
        inputs: [architecture-current]
        outputs: [stakeholder-list]
        mechanism:
          profile: mais
          skills: ["stakeholder-mapping"]

      - index: 1
        text: "Согласование с заинтересованными сторонами целей проектирования процессной архитектуры организации"
        inputs: [stakeholder-list, business-strategy]
        outputs: [agreed-goals]
        mechanism:
          profile: mais
          skills: ["meeting-facilitation"]

      - index: 2
        text: "Определение требований к процессной архитектуре организации исходя из структуры бизнеса, целей и стратегии организации"
        inputs: [agreed-goals, business-strategy]
        outputs: [architecture-requirements]
        mechanism:
          profile: mais
          skills: ["requirements-analysis"]

      - index: 3
        text: "Сбор информации о процессной архитектуре организации"
        inputs: [architecture-current]
        outputs: [architecture-data]
        mechanism:
          profile: mais
          skills: ["process-survey"]

      - index: 4
        text: "Анализ соответствия существующей процессной архитектуры организации требованиям, определенным к процессной архитектуре организации исходя из структуры бизнеса, целей и стратегии организации"
        inputs: [architecture-requirements, architecture-data]
        outputs: [gap-analysis]
        mechanism:
          profile: mais
          skills: ["gap-analysis"]

      - index: 5
        text: "Выявление возможностей усовершенствования процессной архитектуры организации"
        inputs: [gap-analysis]
        outputs: [improvement-opportunities]
        mechanism:
          profile: mais
          skills: ["process-optimization-analysis"]

      - index: 6
        text: "Оформление результатов анализа процессной архитектуры организации"
        inputs: [gap-analysis, improvement-opportunities]
        outputs: [analysis-report]
        mechanism:
          profile: mais
          skills: ["technical-writing"]

      - index: 7
        text: "Презентация результатов анализа процессной архитектуры организации"
        inputs: [analysis-report]
        outputs: [architecture-analysis]
        mechanism:
          profile: mais
          skills: ["presentation"]

