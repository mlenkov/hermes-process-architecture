  - "Интегрировать процессную архитектуру организации с архитектурой корпоративных информационных систем"
  необходимые_знания:
  - "Методы моделирования архитектуры процессов организации"
  - "Методы структурной декомпозиции процессов"
  - "Принципы и методы трансляции целей организации в показатели процессов"
  - "Методы моделирования процессов"
  - "Архитектура корпоративных информационных систем"
  - "Концепции интегрированных программных продуктов для управления бизнес-процессами"
  - "Принципы интеграции корпоративных информационных систем"
  - "Референтные модели процессной архитектуры"

